openapi: 3.1.0
info:
  title: Switchboard Service API
  version: 1.0.0
  description: 'Frozen shared API. Service ownership: A Strategy, B Markets, C Execution. Sandbox/testnet by default. No unauthenticated
    live trading.'
servers:
- url: http://localhost:4101
  description: Agent A Strategy; other services at 4102/4103
tags:
- name: Strategy
- name: Markets
- name: Execution
paths:
  /v1/companies/analyze:
    post:
      tags:
      - Strategy
      summary: Parse and structure exposure candidates; user must confirm assumptions
      operationId: strategy1
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyAnalyzeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAnalysisResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/strategies/generate:
    post:
      tags:
      - Strategy
      summary: Minimize severe downside risk subject to budget, expiry, eligibility and liquidity
      operationId: strategy2
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateStrategyRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HedgePlan'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/markets/search:
    post:
      tags:
      - Markets
      summary: Discover normalized opportunities and objectively measured basis risk
      operationId: markets3
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketSearchRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSearchResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/markets/orders:
    post:
      tags:
      - Markets
      summary: Place approved venue order or sandbox trade; never circumvent eligibility
      operationId: markets4
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Execution-Authorization
        in: header
        required: true
        description: Signed short-lived scoped authorization issued by Agent C, or distinct approved maker-order role on sandbox
          exchange. B MUST cryptographically validate issuer, audience, quote, amount, venue, nonce and expiry.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketOrderRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOrderResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/exchange/rfqs:
    post:
      tags:
      - Markets
      summary: Open bounded contract RFQ (sandbox)
      operationId: markets5
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RfqRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqRequest'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/exchange/rfqs/{rfqId}/quotes:
    post:
      tags:
      - Markets
      summary: Publish firm RFQ quote before expiration
      operationId: markets6
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: rfqId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RfqQuote'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqQuote'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/exchange/rfqs/{rfqId}/accept:
    post:
      tags:
      - Markets
      summary: Accept firm collateralized RFQ under plan approval
      operationId: markets7
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: rfqId
        in: path
        required: true
        schema:
          type: string
      - name: X-Execution-Authorization
        in: header
        required: true
        description: Signed short-lived scoped authorization issued by Agent C, or distinct approved maker-order role on sandbox
          exchange. B MUST cryptographically validate issuer, audience, quote, amount, venue, nonce and expiry.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RfqAcceptRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqQuote'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/exchange/orders:
    post:
      tags:
      - Markets
      summary: Submit sandbox exchange limit order
      operationId: markets8
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Execution-Authorization
        in: header
        required: true
        description: Signed short-lived scoped authorization issued by Agent C, or distinct approved maker-order role on sandbox
          exchange. B MUST cryptographically validate issuer, audience, quote, amount, venue, nonce and expiry.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeOrder'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOrderResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/exchange/orderbook/{instrumentId}:
    get:
      tags:
      - Markets
      summary: Get normalized price-time orderbook
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeOrderbook'
      parameters:
      - name: instrumentId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
  /v1/execution/approvals:
    post:
      tags:
      - Execution
      summary: Create immutable pending approval request
      operationId: execution10
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/execution/approvals/{approvalId}/confirm:
    post:
      tags:
      - Execution
      summary: Verify real approval evidence and capability
      operationId: execution11
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalConfirmRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/execution/runs:
    post:
      tags:
      - Execution
      summary: Execute only previously approved plan, idempotently
      operationId: execution12
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRunRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRun'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /v1/execution/runs/{runId}:
    get:
      tags:
      - Execution
      summary: Read execution run status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRun'
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
  /v1/failover/simulate:
    post:
      tags:
      - Execution
      summary: Inject service failure and orchestrate testnet fallback
      operationId: execution14
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailoverSimulateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailoverRun'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not eligible / not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale/reapproval/conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - BearerAuth: []
  /healthz:
    get:
      tags:
      - Strategy
      - Markets
      - Execution
      summary: Each service independently serves this health endpoint at its own host/port
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: string
                required:
                - status
                - service
                - version
  /v1/companies/{companyId}:
    get:
      tags:
      - Strategy
      summary: Fetch confirmed company risk profile
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAnalysisResponse'
        '404':
          description: Not found
  /v1/strategies/{planId}:
    get:
      tags:
      - Strategy
      summary: Fetch immutable versioned hedge plan
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HedgePlan'
        '404':
          description: Not found
  /v1/markets/instruments/{instrumentId}:
    get:
      tags:
      - Markets
      summary: Fetch exact venue contract terms
      parameters:
      - name: instrumentId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '404':
          description: Not found
  /v1/exchange/instruments:
    get:
      tags:
      - Markets
      summary: List native exchange instruments
      parameters: []
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentList'
        '404':
          description: Not found
  /v1/exchange/rfqs/{rfqId}:
    get:
      tags:
      - Markets
      summary: Read RFQ terms
      parameters:
      - name: rfqId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqRequest'
        '404':
          description: Not found
  /v1/failover/runs/{failoverId}:
    get:
      tags:
      - Execution
      summary: Read failover state, budget and payment receipts
      parameters:
      - name: failoverId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailoverRun'
        '404':
          description: Not found
  /v1/failover/arm:
    post:
      tags:
      - Execution
      summary: Arm monitored, approved policy-bound fallback
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailoverArmRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailoverArmResponse'
  /v1/failover/disable:
    post:
      tags:
      - Execution
      summary: Disable fallback monitoring immediately
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailoverDisableRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailoverArmResponse'
components:
  schemas:
    Scenario:
      type: object
      properties:
        scenarioId:
          type: string
        label:
          type: string
        probability:
          type: number
          minimum: 0
          maximum: 1
        baselineLossUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        factorShocks:
          type: object
          additionalProperties:
            type: number
        source:
          type: string
          enum:
          - synthetic
          - historical
          - user_supplied
      required:
      - scenarioId
      - label
      - probability
      - baselineLossUsd
      - factorShocks
      - source
      additionalProperties: false
    RiskExposure:
      type: object
      properties:
        exposureId:
          type: string
        category:
          type: string
          enum:
          - operational
          - digital
          - climate
          - commodity
          - supply_chain
          - regulatory
          - financial
          - other
        label:
          type: string
        description:
          type: string
        riskFactors:
          type: array
          items:
            type: string
        horizonDays:
          type: integer
          minimum: 1
        scenarioIds:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required:
      - exposureId
      - category
      - label
      - description
      - riskFactors
      - horizonDays
      - scenarioIds
      - confidence
      additionalProperties: false
    CompanyProfile:
      type: object
      properties:
        companyId:
          type: string
        name:
          type: string
        description:
          type: string
        jurisdiction:
          type: string
        baseCurrency:
          type: string
          enum:
          - USD
        monthlyHedgeBudgetUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        maxTolerableTailLossUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        cvarAlpha:
          type: number
          minimum: 0.5
          maximum: 0.999
        exposures:
          type: array
          items:
            $ref: '#/components/schemas/RiskExposure'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/Scenario'
        confirmedByUser:
          type: boolean
      required:
      - companyId
      - name
      - description
      - jurisdiction
      - baseCurrency
      - monthlyHedgeBudgetUsd
      - maxTolerableTailLossUsd
      - cvarAlpha
      - exposures
      - scenarios
      - confirmedByUser
      additionalProperties: false
    CompanyAnalyzeRequest:
      type: object
      properties:
        description:
          type: string
        jurisdiction:
          type: string
        monthlyHedgeBudgetUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        maxTolerableTailLossUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
      required:
      - description
      - jurisdiction
      - monthlyHedgeBudgetUsd
      - maxTolerableTailLossUsd
      additionalProperties: false
    CompanyAnalysisResponse:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/CompanyProfile'
        assumptions:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
      - company
      - assumptions
      - warnings
      additionalProperties: false
    Instrument:
      type: object
      properties:
        instrumentId:
          type: string
        venue:
          type: string
          enum:
          - kalshi
          - polymarket_us
          - polymarket_international
          - switchboard
          - capacity_provider
        name:
          type: string
        riskFactor:
          type: string
        settlementType:
          type: string
          enum:
          - binary
          - capped_call
          - capacity_option
        eventRule:
          type: string
        resolutionSourceUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
        payoutPerUnitUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        maximumPayoutUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        collateralCurrency:
          type: string
        unitDescription:
          type: string
        comparisonGroupId:
          type: string
      required:
      - instrumentId
      - venue
      - name
      - riskFactor
      - settlementType
      - eventRule
      - resolutionSourceUrl
      - expiresAt
      - payoutPerUnitUsd
      - maximumPayoutUsd
      - collateralCurrency
      - unitDescription
      additionalProperties: false
    FeeBreakdown:
      type: object
      properties:
        tradingFeeUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        networkFeeUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
        conversionFeeUsd:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]+)?$
          description: Base USD amount encoded as a decimal string
